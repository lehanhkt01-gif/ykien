services:
  # 1. Cơ sở dữ liệu PostgreSQL 16 Alpine (Bảo mật tối đa, không expose port ra ngoài)
  db:
    image: postgres:16-alpine
    container_name: easup_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-EaSupSecuredPass2026!}
      POSTGRES_DB: ${DB_NAME:-voter_feedback_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    # Tuyệt đối KHÔNG cấu hình ports: - "5432:5432" để tránh lộ CSDL ra Internet công cộng
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-voter_feedback_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Next.js 15 Standalone
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easup_web_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-EaSupSecuredPass2026!}@db:5432/${DB_NAME:-voter_feedback_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-easup_voter_feedback_jwt_secret_super_key_2026_production}
      AUTH_SECRET: ${AUTH_SECRET:-easup_auth_secret_random_string_key_2026_change_me}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://ykien.easupso.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@EaSup2026!}
      PORT: 3000
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net
    ports:
      - "3000:3000"

# Khai báo Volume dữ liệu bền vững và Network nội bộ
volumes:
  postgres_data:
    driver: local

networks:
  internal_net:
    driver: bridge
